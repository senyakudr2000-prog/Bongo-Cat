name: Build Bongo Cat APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Extract Android project ZIP
        shell: bash
        run: |
          if [ -f "BongoCat-Android.zip" ]; then
            unzip -oq "BongoCat-Android.zip" -d .
          elif [ -f "app/build.gradle" ]; then
            echo "Project files are already extracted."
          else
            echo "ERROR: Put BongoCat-Android.zip in the repository root, or upload the extracted project files."
            exit 1
          fi
          test -f settings.gradle
          test -f app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BongoCat-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
