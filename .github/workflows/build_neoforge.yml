name: Build mod (NeoForge 1.21.1)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Unpack sources zip
        run: |
          set -e
          ZIP=$(ls -1 *.zip 2>/dev/null | head -n1 || true)
          if [ -z "$ZIP" ]; then echo "No .zip with sources in the repository root"; exit 1; fi
          echo "Using $ZIP"
          rm -rf work && mkdir work
          unzip -q -o "$ZIP" -d work
          find work -maxdepth 3 -name settings.gradle -printf '%h\n' | sort > projects.txt
          echo "Projects:"; cat projects.txt

      - name: Pick latest NeoForge 21.1.x and ModDevGradle
        run: |
          curl -fsSL https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml -o nf.xml || true
          NEO=$(grep -o '<version>21\.1\.[0-9]*</version>' nf.xml 2>/dev/null | sed 's/<[^>]*>//g' | sort -V | tail -n1 || true)
          curl -fsSL https://plugins.gradle.org/m2/net/neoforged/moddev/net.neoforged.moddev.gradle.plugin/maven-metadata.xml -o md.xml || true
          MD=$(grep -o '<release>[^<]*</release>' md.xml 2>/dev/null | sed 's/<[^>]*>//g' | head -n1 || true)
          echo "NeoForge: ${NEO:-keep default}  ModDevGradle: ${MD:-keep default}"
          while read -r d; do
            if [ -n "$NEO" ]; then sed -i "s|^neo_version=.*|neo_version=$NEO|" "$d/gradle.properties"; fi
            if [ -n "$MD" ]; then sed -i "s|id 'net.neoforged.moddev' version '[^']*'|id 'net.neoforged.moddev' version '$MD'|" "$d/build.gradle"; fi
          done < projects.txt

      - name: Build all projects
        run: |
          mkdir -p jars logs
          FAIL=0
          while read -r d; do
            name=$(basename "$d")
            echo "=== Building $name ==="
            if (cd "$d" && gradle build --no-daemon --stacktrace > "$GITHUB_WORKSPACE/logs/$name.log" 2>&1); then
              echo "$name OK"
              find "$d/build/libs" -name '*.jar' ! -name '*-sources.jar' -exec cp {} jars/ \;
            else
              echo "$name FAILED (see logs artifact)"
              grep -E "error:|What went wrong" -A3 "$GITHUB_WORKSPACE/logs/$name.log" | head -400 || true
              FAIL=1
            fi
          done < projects.txt
          echo "FAIL=$FAIL" >> "$GITHUB_ENV"

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: mods-jars
          path: jars/*.jar
          if-no-files-found: warn

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: logs/*.log

      - name: Fail if any project failed
        if: env.FAIL == '1'
        run: exit 1
