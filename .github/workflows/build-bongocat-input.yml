name: Build Bongo Cat APK
on:
  workflow_dispatch:
  push:
    paths:
      - '**'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project ZIP if present
        run: |
          if [ -f BongoCat-Android.zip ]; then
            unzip -oq BongoCat-Android.zip -d .
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BongoCat-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
